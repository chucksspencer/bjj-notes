name: iOS

# Builds and tests the iPhone app on GitHub's Macs. On main, once the Apple secrets are set
# (see ios/README.md), it also signs the app with Apple-managed certificates and uploads it to
# TestFlight, so new versions reach the phone without a local Xcode.
on:
  push:
    branches: [main]
    paths: ['ios/**', '.github/workflows/ios.yml']
  pull_request:
    paths: ['ios/**', '.github/workflows/ios.yml']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}
  cancel-in-progress: true

jobs:
  app:
    runs-on: macos-26
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Use the newest Xcode
        run: |
          ls -d /Applications/Xcode*.app
          XCODE=$(ls -d /Applications/Xcode_*.app | grep -vi beta | sort -V | tail -1)
          sudo xcode-select -s "$XCODE"
          xcodebuild -version

      # XcodeGen writes the project that gets signed, so it's built from a pinned commit (with its
      # own pinned dependencies) rather than whatever Homebrew has today. Cached after the first build,
      # with its setting presets: the defaults every target starts from (PRODUCT_NAME, ONLY_ACTIVE_ARCH,
      # ALWAYS_SEARCH_USER_PATHS...). Without them it still writes a project, just a broken one.
      - name: XcodeGen 2.46.0 (cached)
        id: xcodegen
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/xcodegen
          key: xcodegen-8445e778451c7e44237b90281bde622d764b0084-presets-${{ runner.os }}-${{ runner.arch }}

      - name: Build XcodeGen from its pinned commit
        if: steps.xcodegen.outputs.cache-hit != 'true'
        run: |
          SRC="$RUNNER_TEMP/XcodeGen"
          git clone --quiet --depth 1 --branch 2.46.0 https://github.com/yonaskolb/XcodeGen "$SRC"
          test "$(git -C "$SRC" rev-parse HEAD)" = 8445e778451c7e44237b90281bde622d764b0084
          swift build -c release --package-path "$SRC" --product xcodegen
          mkdir -p ~/xcodegen
          cp "$SRC/.build/release/xcodegen" ~/xcodegen/
          # XcodeGen looks for its presets next to itself. (Its resource bundle only holds a link back to
          # this source tree, which a cached copy doesn't have.)
          cp -RL "$SRC/SettingPresets" ~/xcodegen/SettingPresets
          test -f ~/xcodegen/SettingPresets/base.yml
          # Generate from exactly what gets cached, even on this first run, so a gap shows up now.
          rm -rf "$SRC"

      - name: Generate the Xcode project
        run: |
          set -o pipefail
          ~/xcodegen/xcodegen generate 2>&1 | tee "$RUNNER_TEMP/xcodegen.log"
          # Without its presets XcodeGen only prints this and carries on; the build then fails in
          # confusing ways (an unnamed test bundle, both simulator architectures). Stop here instead.
          if grep -q 'settings found' "$RUNNER_TEMP/xcodegen.log"; then
            echo "::error title=XcodeGen presets missing::XcodeGen couldn't find its setting presets, so the project would be wrong. Change the cache key in ios.yml to rebuild XcodeGen."
            exit 1
          fi

      - name: Unit tests
        run: |
          SIM=$(xcrun simctl list devices available -j | python3 -c '
          import json, re, sys
          devices = json.load(sys.stdin)["devices"]
          ios = sorted((k for k in devices if ".iOS-" in k), key=lambda k: [int(x) for x in re.findall(r"\d+", k)])
          for runtime in reversed(ios):
              phones = [d for d in devices[runtime] if d["name"].startswith("iPhone")]
              if phones:
                  print(phones[0]["udid"]); break
          ')
          echo "Simulator: $SIM"
          set -o pipefail
          xcodebuild test -project BJJNotes.xcodeproj -scheme BJJNotes -destination "id=$SIM" CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath "$RUNNER_TEMP/tests.xcresult" \
            | (command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat)

      - name: Report test results and compiler warnings
        if: always()
        run: |
          RESULT="$RUNNER_TEMP/tests.xcresult"
          [ -d "$RESULT" ] || exit 0
          xcrun xcresulttool get test-results summary --path "$RESULT" > "$RUNNER_TEMP/summary.json" || true
          xcrun xcresulttool get build-results --path "$RESULT" > "$RUNNER_TEMP/build.json" || true
          python3 - "$RUNNER_TEMP/summary.json" "$RUNNER_TEMP/build.json" "$(xcodebuild -version | head -1)" <<'PY'
          import json, sys
          def load(p):
              try:
                  return json.load(open(p))
              except Exception:
                  return {}
          t, b, xcode = load(sys.argv[1]), load(sys.argv[2]), sys.argv[3]
          device = ", ".join(f"{d.get('deviceName', '?')} iOS {d.get('osVersion', '?')}" for d in t.get("devicesAndConfigurations", [{}])[0:1] for d in [d.get("device", {})])
          print(f"::notice title=Unit tests::{t.get('passedTests', '?')} passed, {t.get('failedTests', '?')} failed, {t.get('skippedTests', 0)} skipped on {device or 'simulator'} ({xcode})")
          warnings = b.get("warnings", [])
          for w in warnings[:10]:
              print(f"::warning title=Compiler warning::{w.get('message', w)}")
          print(f"{len(warnings)} compiler warnings")
          PY

      - name: Check for Apple credentials
        id: apple
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          READY: ${{ secrets.ASC_KEY_ID != '' && secrets.ASC_ISSUER_ID != '' && secrets.ASC_KEY_P8 != '' && secrets.APPLE_TEAM_ID != '' }}
        run: |
          echo "ready=$READY" >> "$GITHUB_OUTPUT"
          if [ "$READY" != "true" ]; then
            echo "::notice title=TestFlight upload skipped::Add the ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 and APPLE_TEAM_ID secrets to upload builds (see ios/README.md)."
          fi

      - name: Archive, sign and upload to TestFlight
        if: steps.apple.outputs.ready == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -o pipefail
          KEY="$RUNNER_TEMP/AuthKey_$ASC_KEY_ID.p8"
          printf '%s\n' "$ASC_KEY_P8" > "$KEY"
          AUTH=(-allowProvisioningUpdates -authenticationKeyPath "$KEY" -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID")
          BEAUTIFY() { command -v xcbeautify >/dev/null && xcbeautify --renderer github-actions || cat; }
          # The app groups in a bundle's signature (the app and its share extension must both have ours).
          GROUPS_OF() {
            codesign -d --entitlements - --xml "$1" 2>/dev/null | python3 -c '
          import plistlib, sys
          raw = sys.stdin.buffer.read()
          try:
              d = plistlib.loads(raw) if raw.strip() else {}
          except Exception:
              d = {}
          print(",".join(d.get("com.apple.security.application-groups", [])) or "none")'
          }
          ARCHIVE="$RUNNER_TEMP/BJJNotes.xcarchive"
          # Runs an export; if it fails, shows Xcode's reasons (its own and its distribution log's) as annotations.
          EXPORT() {
            local log="$RUNNER_TEMP/export-$1.log"; shift
            if xcodebuild -exportArchive "$@" > "$log" 2>&1; then return 0; fi
            # Xcode's own error lines first, then the distribution log's (skipping its raw API traffic).
            { grep -hE '^(error|warning):|Error Domain=|NSLocalizedDescription|NSLocalizedRecoverySuggestion|EXPORT FAILED' "$log"
              find "${TMPDIR:-/tmp}" -name 'IDEDistribution*.log' -newer "$ARCHIVE" 2>/dev/null \
                | xargs grep -hE 'error|Error|fail|Fail' 2>/dev/null | grep -vE '^\s*"|developerservices|^\s*[{}\[\]],?\s*$'
            } | sed 's/^[[:space:]]*//' | awk '!seen[$0]++' | head -9 | while IFS= read -r line; do echo "::error title=Export::${line:0:900}"; done
            return 1
          }

          # Archive signed "ad hoc" (no certificate), which keeps the entitlements (the app group) in
          # the binaries; the export step re-signs with the team's cloud-managed distribution certificate.
          xcodebuild archive -project BJJNotes.xcodeproj -scheme BJJNotes -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$ARCHIVE" \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGN_STYLE=Manual CODE_SIGN_IDENTITY=- PROVISIONING_PROFILE_SPECIFIER= \
            CODE_SIGNING_REQUIRED=NO PROVISIONING_PROFILE_REQUIRED=NO AD_HOC_CODE_SIGNING_ALLOWED=YES | BEAUTIFY
          APP="$ARCHIVE/Products/Applications/BJJNotes.app"
          echo "::notice title=Archived entitlements::app: $(GROUPS_OF "$APP"); share sheet: $(GROUPS_OF "$APP/PlugIns/BJJNotesShare.appex")"

          options() {
            cat > "$RUNNER_TEMP/ExportOptions-$1.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>$1</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>testFlightInternalTestingOnly</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          }

          # Sign it, and check what's signed before anything goes to Apple.
          options export
          EXPORT signed -archivePath "$ARCHIVE" -exportPath "$RUNNER_TEMP/signed" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-export.plist" "${AUTH[@]}"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q "$RUNNER_TEMP"/signed/*.ipa -d "$RUNNER_TEMP/ipa"
          SIGNED="$RUNNER_TEMP/ipa/Payload/BJJNotes.app"
          APP_GROUPS=$(GROUPS_OF "$SIGNED")
          SHARE_GROUPS=$(GROUPS_OF "$SIGNED/PlugIns/BJJNotesShare.appex")
          echo "::notice title=Signed entitlements::app: $APP_GROUPS; share sheet: $SHARE_GROUPS"
          if [[ "$APP_GROUPS" != *group.com.chucksspencer.bjjnotes* || "$SHARE_GROUPS" != *group.com.chucksspencer.bjjnotes* ]]; then
            echo "::error title=App group missing::The signed app or share sheet lacks group.com.chucksspencer.bjjnotes, so they couldn't share the sign-in. Not uploading."
            exit 1
          fi

          options upload
          EXPORT upload -archivePath "$ARCHIVE" -exportPath "$RUNNER_TEMP/upload" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions-upload.plist" "${AUTH[@]}"
          rm -f "$KEY"
          echo "::notice title=Uploaded to TestFlight::Build $GITHUB_RUN_NUMBER is processing; it shows up in TestFlight in about 10–20 minutes."
