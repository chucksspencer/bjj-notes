name: CI

# Third-party actions are pinned to commit SHAs (a tag can be moved; a commit can't), and Dependabot
# proposes updates after a cooling-off week (.github/dependabot.yml). npm doesn't run install scripts
# (.npmrc), registry signatures are verified, and known vulnerabilities in production packages fail
# the build. Deploys use the exact image digest that was built.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify package signatures from the npm registry
        run: npm audit signatures
      - name: No known high or critical vulnerabilities in production packages
        run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - name: Lint deploy scripts
        run: shellcheck -S warning infra/*.sh
      - name: Build
        run: npm run build
      - name: Tests (embedded PGlite)
        run: npm test
      - name: Tests (Postgres 16, production driver)
        run: npm test
        env:
          TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium
      - name: UI tests (phone-sized Chromium)
        run: npx vitest run test/ui.e2e.test.ts
        env:
          E2E: '1'

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      # By digest: the deploy gets exactly this build, even if a tag were moved in between.
      image: ghcr.io/${{ github.repository }}@${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        env:
          # The repository is public, and so would be the build record artifact; it isn't needed.
          DOCKER_BUILD_RECORD_UPLOAD: 'false'
        with:
          context: .
          push: true
          # arm64 too, so the same image also runs on an Arm VM if you ever move off Cloud Run.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Set a repository variable DEPLOY_DISABLED = true to pause deploys.
    if: vars.DEPLOY_DISABLED != 'true'
    runs-on: ubuntu-latest
    env:
      # Printed by infra/gcp-bootstrap.sh. Not secret: only this repo's main branch can use them.
      # Repository variables of the same name override these (e.g. for a fork).
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/602476730933/locations/global/workloadIdentityPools/github/providers/github' }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'bjj-notes-deploy@bjj-notes-eaaeae.iam.gserviceaccount.com' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency: deploy
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloud Run
        run: bash infra/gcp-deploy.sh
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          IMAGE_TAG: sha-${{ github.sha }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
          SHARE_SHORTCUT_URL: ${{ vars.SHARE_SHORTCUT_URL }}
