name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint deploy scripts
        run: shellcheck -S warning infra/*.sh
      - name: Tests (embedded PGlite)
        run: npm test
      - name: Tests (Postgres 16, production driver)
        run: npm test
        env:
          TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 too, so the same image also runs on an Arm VM if you ever move off Cloud Run.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Runs once the GCP_* repository variables printed by infra/gcp-bootstrap.sh are set.
    if: vars.GCP_SERVICE_ACCOUNT != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloud Run
        run: bash infra/gcp-deploy.sh
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT }}
          GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
