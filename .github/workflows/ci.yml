name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - name: Lint deploy scripts
        run: shellcheck -S warning infra/*.sh
      - name: Build
        run: npm run build
      - name: Tests (embedded PGlite)
        run: npm test
      - name: Tests (Postgres 16, production driver)
        run: npm test
        env:
          TEST_PG_ADMIN_URL: postgres://postgres:postgres@localhost:5432/postgres
      - name: Install Chromium for the UI tests
        run: npx playwright install --with-deps chromium
      - name: UI tests (phone-sized Chromium)
        run: npx vitest run test/ui.e2e.test.ts
        env:
          E2E: '1'

  image:
    needs: test
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          # arm64 too, so the same image also runs on an Arm VM if you ever move off Cloud Run.
          platforms: linux/amd64,linux/arm64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    needs: image
    # Set a repository variable DEPLOY_DISABLED = true to pause deploys.
    if: vars.DEPLOY_DISABLED != 'true'
    runs-on: ubuntu-latest
    env:
      # Printed by infra/gcp-bootstrap.sh. Not secret: only this repo's main branch can use them.
      # Repository variables of the same name override these (e.g. for a fork).
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER || 'projects/602476730933/locations/global/workloadIdentityPools/github/providers/github' }}
      GCP_SERVICE_ACCOUNT: ${{ vars.GCP_SERVICE_ACCOUNT || 'bjj-notes-deploy@bjj-notes-eaaeae.iam.gserviceaccount.com' }}
    permissions:
      contents: read
      packages: read
      id-token: write
    concurrency: deploy
    steps:
      - uses: actions/checkout@v4
      - uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: ${{ env.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ env.GCP_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Deploy to Cloud Run
        run: bash infra/gcp-deploy.sh
        env:
          IMAGE: ${{ needs.image.outputs.image }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          OWNER_PASSWORD: ${{ secrets.OWNER_PASSWORD }}
          API_TOKEN: ${{ secrets.API_TOKEN }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          PUBLIC_URL: ${{ vars.PUBLIC_URL }}
          TIME_ZONE: ${{ vars.TIME_ZONE }}
