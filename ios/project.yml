# Generates BJJNotes.xcodeproj: `brew install xcodegen && xcodegen generate` (CI does this on every build).
name: BJJNotes
options:
  bundleIdPrefix: com.chucksspencer
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_STYLE: Automatic
    # Set by the cloud build from the APPLE_TEAM_ID secret.
    DEVELOPMENT_TEAM: ""
targets:
  BJJNotes:
    type: application
    platform: iOS
    sources:
      - path: BJJNotes
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.chucksspencer.bjjnotes
        PRODUCT_NAME: BJJNotes
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        BJJ_SERVER_URL: https://bjj-notes-602476730933.us-central1.run.app
    info:
      path: BJJNotes/Info.plist
      properties:
        CFBundleDisplayName: BJJ Notes
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        BJJServerURL: $(BJJ_SERVER_URL)
        ITSAppUsesNonExemptEncryption: false
        LSApplicationCategoryType: public.app-category.sports
        UILaunchScreen:
          UIColorName: Canvas
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [com.chucksspencer.bjjnotes.sync]
    scheme:
      testTargets: [BJJNotesTests]
  BJJNotesTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: BJJNotesTests
    dependencies:
      - target: BJJNotes
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.chucksspencer.bjjnotes.tests
